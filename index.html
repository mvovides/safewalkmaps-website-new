    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does SafeWalkMaps work out which route is safer?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every street segment on a candidate route is scored on street lighting, recent police-recorded incident density, how busy the street tends to be at your departure time, CCTV coverage where that data exists, community reports and context such as roadworks or closed pavements. Segment scores roll up into a length-weighted route score, with penalties for the worst segment on the route and for how much of the walk sits below a low-score threshold — so one long dark stretch cannot hide behind a good average."
            }
          },
          {
            "@type": "Question",
            "name": "Does a high Safety Score mean a route is safe?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. A Safety Score is a relative comparison between the routes available to you at a particular time, produced from the data we hold for that area. It is not a guarantee, a prediction, or a substitute for your own judgement. A higher-scoring route is not risk-free and a lower-scoring street is not inherently dangerous."
            }
          },
          {
            "@type": "Question",
            "name": "What data does SafeWalkMaps use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Council streetlight records, published police incident data, foot traffic patterns, CCTV locations where councils publish them, roadworks and closure feeds, and anonymised community reports from people using the app. Each signal carries a confidence value based on how reliable and how recent it is."
            }
          },
          {
            "@type": "Question",
            "name": "Which cities does SafeWalkMaps cover?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "SafeWalkMaps is in beta in London and Sheffield. Coverage depends on the quality of open data a city publishes, so we are expanding city by city based on demand. Joining the waitlist tells us where to look next."
            }
          },
          {
            "@type": "Question",
            "name": "When does the iOS app launch?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "SafeWalkMaps is being prepared for iOS and we have not committed to a public launch date. Rather than announce a date we might miss, we email the waitlist first when the build is ready to hand out."
            }
          },
          {
            "@type": "Question",
            "name": "How does SafeWalkMaps handle my location?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your live location is not stored on our servers. Routing happens against map and safety data rather than a history of where you have walked. If you share your walk, that creates a temporary link that expires. Community reports are anonymised, and you can use the app without creating an account."
            }
          },
          {
            "@type": "Question",
            "name": "Can I just take the fastest route?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Fastest, Balanced and Safer are presented side by side with their times and scores, and you choose. SafeWalkMaps adds information to that decision; it never takes the decision away from you."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work at night?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Night is the case it is built for. Lighting carries far more weight after dark, foot traffic is scored against what is normal for that street at that hour, and the same route can score differently at 7pm and at 1am."
            }
          }
        ]
      }
